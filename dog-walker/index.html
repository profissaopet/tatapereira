<style>
    /* =========================================================
       DESIGN SYSTEM - DUAL PALETTE (DEEP NAVY & CREAM CHAMPAGNE)
       ========================================================= */
    :root {
      /* PALETA ESCURA (NAVY) */
      --navy-base: #050717;
      --navy-surface-1: #0a0e28;
      --navy-surface-2: #101538;
      --navy-card: rgba(16, 21, 56, 0.78);
      --navy-card-hover: rgba(24, 31, 78, 0.92);
      --navy-glass: rgba(10, 14, 40, 0.88);

      --navy-text-main: #f8fafc;
      --navy-text-muted: #9ba3c7;
      --navy-border-subtle: rgba(255, 255, 255, 0.08);
      --navy-border-card: rgba(255, 255, 255, 0.12);

      /* PALETA CLARA (CREAM / CHAMPAGNE) */
      --cream-base: #fcfaf6;
      --cream-surface-1: #ffffff;
      --cream-surface-2: #f6f2e9;
      --cream-card: #ffffff;

      --cream-text-main: #0a0e28;
      --cream-text-body: #334155;
      --cream-text-muted: #5e697d;
      --cream-border-card: #ebdcc8;

      /* ACENTOS E IDENTIDADE */
      --gold-primary: #f1bf42;
      --gold-hover: #dfa82e;
      --gold-muted: rgba(241, 191, 66, 0.14);
      --gold-border: rgba(241, 191, 66, 0.35);
      --gold-dark: #b58e1c;

      --accent-red: #ef4444;
      --accent-green: #10b981;

      /* ESPAÇAMENTOS E RAIOS */
      --spacing-section: clamp(50px, 7vw, 90px);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;

      --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.15);
      --shadow-md: 0 12px 35px rgba(0, 0, 0, 0.28);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.4);
      --shadow-cream: 0 10px 25px rgba(10, 14, 40, 0.05);

      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--navy-base);
      color: var(--navy-text-main);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .gold {
      color: var(--gold-primary);
    }

    section {
      padding: var(--spacing-section) 0;
      position: relative;
    }

    /* SEÇÃO CLARA (CREAM) */
    .section-cream {
      background-color: var(--cream-base);
      color: var(--cream-text-main);
      border-top: 1px solid var(--cream-border-card);
      border-bottom: 1px solid var(--cream-border-card);
    }

    .section-cream h2,
    .section-cream h3 {
      color: var(--cream-text-main);
    }

    .section-cream p {
      color: var(--cream-text-body);
    }

    .section-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-primary);
      margin-bottom: 10px;
      display: block;
      font-family: 'Montserrat', sans-serif;
    }

    .section-cream .section-kicker {
      color: var(--gold-dark);
    }

    h2 {
      font-size: clamp(24px, 3.8vw, 40px);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
      font-family: 'Montserrat', sans-serif;
      color: var(--navy-text-main);
    }

    .section-cream h2 {
      color: var(--cream-text-main);
    }

    /* =========================================================
       BOTÃO PRINCIPAL COM SHIMMER EFFECT
       ========================================================= */
    .primary {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-hover));
      color: #050717;
      cursor: pointer;
      font-size: clamp(0.78rem, 2vw, 0.85rem);
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
      box-shadow: 0 10px 25px rgba(241, 191, 66, .2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      gap: 10px;
      padding: 12px 28px;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
      text-align: center;
    }

    .primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s ease;
    }

    .primary:hover::after {
      left: 140%;
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(241, 191, 66, .35);
      filter: brightness(1.05);
    }

    /* =========================================================
       1. HEADER
       ========================================================= */
    header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: var(--navy-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--navy-border-subtle);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
    }

    .logo img:first-child {
      height: 26px;
      width: auto;
      object-fit: contain;
    }

    .logo img:last-child {
      height: 16px;
      width: auto;
      object-fit: contain;
    }

    /* =========================================================
       2. HERO (PRIMEIRA DOBRA)
       ========================================================= */
    .hero {
      padding-top: clamp(35px, 5vw, 60px);
      padding-bottom: clamp(40px, 6vw, 70px);
      background:
        radial-gradient(circle at 75% 35%, rgba(241, 191, 66, 0.12) 0%, rgba(5, 7, 23, 0) 55%),
        radial-gradient(circle at 20% 80%, rgba(16, 21, 56, 0.9) 0%, rgba(5, 7, 23, 0) 65%),
        var(--navy-base);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 40px;
    }

    .pill-tag-dark {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--navy-border-card);
      color: var(--navy-text-main);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
      font-family: 'Montserrat', sans-serif;
    }

    .hero h1 {
      font-size: clamp(32px, 4.5vw, 54px);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 16px;
      font-family: 'Montserrat', sans-serif;
    }

    .hero-subtitle {
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      color: var(--navy-text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .hero-features-bar {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--navy-border-subtle);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 0.82rem;
      color: var(--navy-text-muted);
      font-weight: 500;
    }

    .hero-author-card {
      position: relative;
      background: var(--navy-card);
      border: 1.5px solid var(--navy-border-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }

    .hero-author-card img {
      width: 100%;
      height: 460px;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .hero-author-info {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(5, 7, 23, 0.9);
      border: 1px solid var(--navy-border-card);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: var(--radius-md);
    }

    .hero-author-info strong {
      display: block;
      color: var(--navy-text-main);
      font-size: 0.95rem;
    }

    .hero-author-info span {
      font-size: 0.8rem;
      color: var(--gold-primary);
    }

    .hero-stat-circle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 76px;
      height: 76px;
      background: var(--gold-primary);
      color: #050717;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 900;
      font-family: 'Montserrat', sans-serif;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      line-height: 1;
      padding: 6px;
    }

    .hero-stat-circle strong {
      font-size: 1.3rem;
    }

    .hero-stat-circle span {
      font-size: 0.52rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    /* =========================================================
       3. VOCÊ NÃO ESTÁ SÓ PASSEANDO... (NAVY)
       ========================================================= */
    .timeline-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .timeline-card {
      background: var(--navy-card);
      border: 1.5px solid var(--navy-border-card);
      border-radius: var(--radius-md);
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .timeline-card.gold-card {
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-hover));
      border: none;
      color: #050717;
    }

    .timeline-card.gold-card .timeline-tag,
    .timeline-card.gold-card h3,
    .timeline-card.gold-card p {
      color: #050717 !important;
    }

    .timeline-tag {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--navy-text-muted);
      margin-bottom: 10px;
      display: block;
    }

    .timeline-card h3 {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--navy-text-main);
      font-family: 'Montserrat', sans-serif;
    }

    .timeline-card p {
      font-size: 0.88rem;
      color: var(--navy-text-muted);
      line-height: 1.5;
    }

    .banner-good-news {
      text-align: center;
      margin-top: 30px;
      font-weight: 800;
      font-size: 1rem;
      color: var(--gold-primary);
      font-style: italic;
    }

    /* =========================================================
       4. TALVEZ VOCÊ PENSE / OBJEÇÕES (CREAM com FOTO À ESQUERDA)
       ========================================================= */
    .objections-wrapper {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 40px;
      align-items: center;
      max-width: 1000px;
      margin: 30px auto 0;
    }

    .objection-img {
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 480px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1.5px solid var(--cream-border-card);
      box-shadow: var(--shadow-cream);
      background: var(--cream-surface-2);
    }

    .objection-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
    }

    .objections-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .objection-card {
      background: var(--cream-card);
      border: 1.5px solid var(--cream-border-card);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-cream);
    }

    .objection-card strong {
      display: block;
      font-size: 0.85rem;
      color: var(--cream-text-main);
      margin-bottom: 6px;
    }

    .objection-card p {
      font-size: 0.83rem;
      color: var(--gold-dark);
      font-weight: 700;
    }

    /* =========================================================
       5. O ROTEIRO DO CURSO / PARADAS (CREAM com FOTO À DIREITA)
       ========================================================= */
    .stops-wrapper {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 40px;
      align-items: center;
      max-width: 1000px;
      margin: 30px auto 0;
    }

    .stops-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stop-card {
      background: var(--cream-card);
      border: 1.5px solid var(--cream-border-card);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-cream);
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .stop-num {
      width: 32px;
      height: 32px;
      background: var(--cream-text-main);
      color: var(--cream-card);
      font-weight: 900;
      font-size: 0.95rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stop-content h3 {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--cream-text-main);
      margin-bottom: 2px;
    }

    .stop-content p {
      font-size: 0.83rem;
      color: var(--cream-text-muted);
      line-height: 1.45;
    }

    .stops-img-card {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 480px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1.5px solid var(--cream-border-card);
      box-shadow: var(--shadow-cream);
    }

    .stops-img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .stops-features-badge {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(10, 14, 40, 0.92);
      border: 1px solid var(--gold-border);
      backdrop-filter: blur(10px);
      padding: 12px;
      border-radius: var(--radius-md);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: center;
    }

    .stops-feature-item strong {
      display: block;
      font-size: 0.72rem;
      color: var(--navy-text-main);
    }

    .stops-feature-item span {
      font-size: 0.7rem;
      color: var(--gold-primary);
      text-transform: lowercase;
    }

    /* =========================================================
       6. QUANDO VOCÊ SE PROFISSIONALIZA... (CREAM)
       ========================================================= */
    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 1000px;
      margin: 30px auto 0;
    }

    .benefit-card {
      background: var(--cream-card);
      border: 1.5px solid var(--cream-border-card);
      border-radius: var(--radius-md);
      padding: 20px 16px;
      box-shadow: var(--shadow-cream);
    }

    .benefit-card h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--cream-text-main);
      margin-bottom: 8px;
      font-family: 'Montserrat', sans-serif;
    }

    .benefit-card p {
      font-size: 0.83rem;
      color: var(--cream-text-muted);
      line-height: 1.5;
    }

    /* =========================================================
       7. QUEM VAI TE ENSINAR / SOBRE A TATA (BIO PADRONIZADA)
       ========================================================= */
    .about {
      background:
        radial-gradient(circle at 80% 30%, rgba(241, 191, 66, 0.08) 0%, rgba(5, 7, 23, 0) 50%),
        var(--navy-surface-1);
      color: var(--navy-text-main);
      padding: 100px 0;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      align-items: center;
      gap: 60px;
    }

    .about-image-wrap {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--navy-border-card);
      box-shadow: var(--shadow-lg);
    }

    .about-image-wrap img {
      width: 100%;
      object-fit: cover;
      display: block;
    }

    .about-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-primary);
      background: var(--gold-muted);
      border: 1px solid var(--gold-border);
      padding: 5px 12px;
      border-radius: var(--radius-full);
      margin-bottom: 14px;
    }

    .section-title-navy {
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 900;
      color: var(--navy-text-main);
      margin-bottom: 16px;
      font-family: 'Montserrat', sans-serif;
    }

    .about-lead {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      color: #f1f5f9;
      margin-top: 12px;
      margin-bottom: 16px;
    }

    .about-story {
      font-size: 15px;
      line-height: 1.75;
      color: var(--navy-text-muted);
    }

    .about-story p {
      margin-bottom: 12px;
    }

    .about-highlights-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
      margin-bottom: 30px;
    }

    .about-highlight-card {
      background: rgba(5, 7, 23, 0.55);
      border: 1px solid var(--navy-border-subtle);
      padding: 14px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: var(--transition);
    }

    .about-highlight-card:hover {
      border-color: var(--gold-border);
      background: rgba(16, 21, 56, 0.7);
    }

    .about-highlight-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--gold-muted);
      border: 1px solid var(--gold-border);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
      flex-shrink: 0;
    }

    .about-highlight-text {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.4;
    }

    /* =========================================================
       8. SEU PASSE PARA A PROFISSIONALIZAÇÃO & OFERTA (CREAM)
       ========================================================= */
    .offer-wrapper {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      max-width: 940px;
      margin: 30px auto 0;
      align-items: stretch;
    }

    .offer-includes {
      background: var(--cream-card);
      border: 1.5px solid var(--cream-border-card);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-cream);
    }

    .offer-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 0.88rem;
      color: var(--cream-text-body);
    }

    .offer-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .offer-list li span.check {
      color: var(--gold-dark);
      font-weight: 900;
    }

    .offer-card-price {
      background: var(--navy-surface-1);
